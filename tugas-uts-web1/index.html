<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | TokoBukuDepan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<main class="login-wrap">
  <section class="card login-card">
    <h1>📚 TokoBukuDepan</h1>
    <p class="muted">Masuk untuk memesan buku</p>
    <form id="form-login" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="rina@gmail.com">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password">
      <p class="error" id="login-error" aria-live="polite"></p>
      <button type="submit" class="btn btn-block">Login</button>
    </form>
    <div class="row-center">
      <button class="btn btn-outline btn-small" data-open="modal-lupa">Lupa Password</button>
      <button class="btn btn-outline btn-small" data-open="modal-daftar">Daftar</button>
    </div>
    <p class="muted small">Demo: rina@gmail.com / rina123 (atau agus@gmail.com / agus123)</p>
  </section>
</main>

<div id="modal-lupa" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-box">
    <h3>Lupa Password</h3>
    <form id="form-lupa" novalidate>
      <label for="lupa-email">Email terdaftar</label>
      <input type="email" id="lupa-email">
      <p class="error" id="lupa-error"></p>
      <div class="row-end"><button type="button" class="btn btn-outline" data-close>Batal</button>
      <button type="submit" class="btn">Kirim Link Reset</button></div>
    </form>
  </div>
</div>

<div id="modal-daftar" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-box">
    <h3>Daftar Akun Baru</h3>
    <form id="form-daftar" novalidate>
      <label for="reg-nama">Nama Lengkap</label><input type="text" id="reg-nama">
      <label for="reg-email">Email</label><input type="email" id="reg-email">
      <label for="reg-pass">Password (min. 5 karakter)</label><input type="password" id="reg-pass">
      <p class="error" id="reg-error"></p>
      <div class="row-end"><button type="button" class="btn btn-outline" data-close>Batal</button>
      <button type="submit" class="btn">Daftar</button></div>
    </form>
  </div>
</div>
<div id="modal-alert" class="modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-box"><h3 id="alert-title">Informasi</h3><p id="alert-msg"></p>
  <button class="btn" data-close>OK</button></div>
</div>
<footer class="footer"><p>&copy; 2026 BukuKita – Tugas UTS Pemrograman Web 1</p></footer>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
